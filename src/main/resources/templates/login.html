<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="utf-8">
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <title>Login & Register - JWT Demo with Nimbus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #f1f5f9;
        }
        .card-custom {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 440px;
        }
        .nav-tabs .nav-link {
            color: #94a3b8;
            font-weight: 500;
            border: none;
            border-bottom: 2px solid transparent;
        }
        .nav-tabs .nav-link.active {
            color: #38bdf8;
            background: transparent;
            border-color: #38bdf8;
        }
        .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 8px;
            padding: 10px 14px;
        }
        .form-control:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
        }
        .form-label {
            color: #cbd5e1;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-gradient:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <div class="card card-custom p-4">
                    <div class="text-center mb-3">
                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle mb-2">Nimbus JOSE + JWT</span>
                        <h4 class="fw-bold text-white mb-1">Spring Boot 3 - Security 6</h4>
                        <p class="text-secondary small">Demo JWT Authentication</p>
                    </div>

                    <!-- Tabs -->
                    <ul class="nav nav-tabs nav-fill mb-4" id="authTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button" role="tab">Đăng nhập</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button" role="tab">Đăng ký</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="authTabsContent">
                        <!-- Login Form (Tuân thủ id theo slide: email, password, Login) -->
                        <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
                            <form id="loginForm" onsubmit="return false;">
                                <div class="mb-3">
                                    <label class="form-label" for="email"><i class="bi bi-envelope me-1"></i> Email</label>
                                    <input type="email" class="form-control" name="email" id="email" placeholder="admin@example.com" required autocomplete="on">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="password"><i class="bi bi-shield-lock me-1"></i> Mật khẩu</label>
                                    <input type="password" class="form-control" name="password" id="password" placeholder="••••••••" required autocomplete="on">
                                </div>
                                <button id="Login" type="button" class="btn btn-gradient w-100 mt-2">
                                    <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
                                </button>
                            </form>
                        </div>

                        <!-- Register Form -->
                        <div class="tab-pane fade" id="register-panel" role="tabpanel">
                            <form id="registerForm" onsubmit="return false;">
                                <div class="mb-3">
                                    <label class="form-label" for="reg_fullName"><i class="bi bi-person me-1"></i> Họ và tên</label>
                                    <input type="text" class="form-control" id="reg_fullName" placeholder="Nguyễn Văn A" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="reg_email"><i class="bi bi-envelope me-1"></i> Email</label>
                                    <input type="email" class="form-control" id="reg_email" placeholder="user@example.com" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="reg_password"><i class="bi bi-shield-lock me-1"></i> Mật khẩu</label>
                                    <input type="password" class="form-control" id="reg_password" placeholder="••••••••" required>
                                </div>
                                <button id="RegisterBtn" type="button" class="btn btn-success w-100 mt-2">
                                    <i class="bi bi-person-plus me-1"></i> Đăng ký tài khoản
                                </button>
                            </form>
                        </div>
                    </div>

                    <div id="authAlert" class="alert mt-3 d-none" role="alert"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="/js/mainjs.js"></script>
</body>
</html>
