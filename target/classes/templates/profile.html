<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="utf-8">
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <title>Spring Boot Rest API with ajax</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #f1f5f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-card {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            padding: 2.5rem;
            max-width: 550px;
            width: 100%;
        }
        #images {
            border: 3px solid #38bdf8;
            border-radius: 50%;
            object-fit: cover;
            width: 110px;
            height: 110px;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
        }
        .user-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-top: 1rem;
        }
        .user-email {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .token-box {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.75rem;
            word-break: break-all;
            max-height: 100px;
            overflow-y: auto;
            color: #a5f3fc;
        }
    </style>
</head>
<body>
    <div class="container py-5" style="min-height: 500px">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="profile-card text-center">
                    <div class="starter-template">
                        <span class="badge bg-info-subtle text-info border border-info-subtle mb-3">Nimbus JWT Authenticated</span>
                        <h2 class="mb-4">Spring Boot REST API with AJAX Example</h2>
                        
                        <div class="my-4">
                            <img id="images" src="https://i.pravatar.cc/150" alt="Avatar" width="100">
                        </div>

                        <!-- ID profile theo đúng slide bài giảng -->
                        <div id="profile" class="user-name mb-1">Đang tải thông tin...</div>
                        <div id="emailInfo" class="user-email mb-4"></div>

                        <div class="text-start mb-4">
                            <small class="text-secondary fw-semibold">Nimbus Signed JWT (Bearer Token):</small>
                            <div class="token-box mt-1" id="tokenDisplay"></div>
                        </div>

                        <div id="feedback" class="text-danger small mb-3"></div>

                        <!-- Button ID logout theo đúng slide bài giảng -->
                        <button id="logout" class="btn btn-outline-danger px-4 py-2">
                            <i class="bi bi-box-arrow-left me-1"></i> Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="/js/mainjs.js"></script>
</body>
</html>
